name: Build and test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/ci -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/ci --config Debug
      - name: Test
        run: ctest --test-dir build/ci -C Debug --output-on-failure
